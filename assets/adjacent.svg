  </defs>

  <rect width="190" height="214" rx="12" fill="url(#bg)"/>
  <path d="M70 20V170M120 20V170M20 70H170M20 120H170" fill="none" stroke="rgba(120,220,190,0.18)" stroke-width="1"/>

  <g fill="none" stroke-width="1.5">
    <rect x="70" y="70" width="50" height="50" stroke="#6fe8c8"/>
    <rect x="70" y="20" width="50" height="50" stroke="rgba(111,232,200,0.55)"/>
    <rect x="120" y="70" width="50" height="50" stroke="rgba(111,232,200,0.55)"/>
    <rect x="70" y="120" width="50" height="50" stroke="rgba(111,232,200,0.55)"/>
