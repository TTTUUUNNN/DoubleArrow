    <rect x="20" y="20" width="50" height="50" stroke="rgba(140,160,175,0.4)"/>
    <rect x="120" y="20" width="50" height="50" stroke="rgba(140,160,175,0.4)"/>
    <rect x="20" y="120" width="50" height="50" stroke="rgba(140,160,175,0.4)"/>
    <rect x="120" y="120" width="50" height="50" stroke="rgba(140,160,175,0.4)"/>
