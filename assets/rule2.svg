<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 208" width="380" height="208" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <style><![CDATA[
.pglow{stroke:rgba(165,180,255,.42);stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pline{stroke:#f0f3ff;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.phead{fill:#f0f3ff}
.pglow-bad{stroke:rgba(255,107,107,.5);stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pline-bad{stroke:#ff6b6b;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.phead-bad{fill:#ff6b6b}
.pglow-ok{stroke:rgba(111,232,200,.55);stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pline-ok{stroke:#6fe8c8;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.phead-ok{fill:#6fe8c8}
]]></style>
  <defs>
    <radialGradient id="boardbg" cx="50%" cy="20%" r="95%">
      <stop offset="0%" stop-color="#142620"/>
      <stop offset="60%" stop-color="#101d19"/>
      <stop offset="100%" stop-color="#0c1714"/>
    </radialGradient>
  </defs>
  <rect width="380" height="208" rx="12" fill="url(#boardbg)"/>
  <g fill="none" stroke="rgba(120,220,190,0.18)" stroke-width="1">
    <path d="M70 30V180M120 30V180M20 80H170M20 130H170"/>
    <path d="M260 30V180M310 30V180M210 80H360M210 130H360"/>
  </g>

  <rect x="70" y="80" width="50" height="50" fill="none" stroke="#6fe8c8" stroke-width="2"/>
  <g transform="translate(20 80)">
    <path d="M19 13.4L19 31L36.6 31" class="pglow"/>
    <path d="M19 13.4L19 31L36.6 31" class="pline"/>
    <path d="M19 13.4L22 20.4L16 20.4ZM36.6 31L29.6 34L29.6 28Z" class="phead"/>
  </g>
  <g transform="translate(70 80)">
    <path d="M36.6 19L19 19L19 36.6" class="pglow-ok"/>
    <path d="M36.6 19L19 19L19 36.6" class="pline-ok"/>
    <path d="M36.6 19L29.6 22L29.6 16ZM19 36.6L16 29.6L22 29.6Z" class="phead-ok"/>
  </g>

  <rect x="260" y="80" width="50" height="50" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <g transform="translate(210 80)">
    <path d="M19 13.4L19 31L36.6 31" class="pglow"/>
    <path d="M19 13.4L19 31L36.6 31" class="pline"/>
    <path d="M19 13.4L22 20.4L16 20.4ZM36.6 31L29.6 34L29.6 28Z" class="phead"/>
  </g>
  <g transform="translate(260 80)">
    <path d="M11 25L39 25" class="pglow-bad"/>
    <path d="M11 25L39 25" class="pline-bad"/>
    <path d="M39 25L32 28L32 22ZM11 25L18 22L18 28Z" class="phead-bad"/>
  </g>

  <g fill="#8fa8a0" font-size="11.5">
    <text x="20" y="192">箭头避开相邻的指向者 → 合法</text>
    <text x="210" y="192">箭头指向相邻的指向者 → 非法</text>
  </g>
